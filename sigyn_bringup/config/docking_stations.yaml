# Dock Stations Database for Sigyn Robot
# Date: 2026-07-31
#
# Reference measurements from docked position:
# - AprilTag ID: 1
# - AprilTag detection score: 76.71
# - AprilTag pose (from oakd_apriltag_optical_frame):
#     position: x=-0.079m, y=0.017m, z=0.364m
#     orientation: x=-0.021, y=-0.009, z=-0.026, w=0.999
# - Charging current when mated: 4.07A (threshold > 0.01A)
# - Charging voltage: 41.73V

docking_server:
  ros__parameters:
    docks: ['home_charging_dock']
    
    home_charging_dock:
      type: 'simple_charging_dock'
      frame: 'map'
      # TODO: Set the actual map coordinates of the charging station
      # These are placeholder values - update with actual dock location in map frame
      pose: [0.0, 0.0, 0.0]  # [x, y, yaw] in map frame
      
      # Detection configuration based on captured AprilTag data
      # AprilTag ID 1 at ~0.364m distance indicates successful docking
      apriltag_id: 1
      expected_distance: 0.364  # meters from camera to tag when docked
      
      # Charging validation thresholds (from /sigyn/power/charger topic)
      charging_current_threshold: 0.01  # Amps - positive value indicates charging
      charging_voltage_nominal: 41.73   # Volts - expected charging voltage
