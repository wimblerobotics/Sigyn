map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: ""

amcl: # See: https://assets.researchsquare.com/files/rs-225880/v1_covered.pdf?c=1631856303
  ros__parameters:
    use_sim_time: True
    alpha1: 0.20       # Expected process noise in odometry’s rotation estimate from rotation.
    alpha2: 0.20       # Expected process noise in odometry’s rotation estimate from translation.
    alpha3: 0.02       # Expected process noise in odometry’s translation estimate from translation.
    alpha4: 0.2        # Expected process noise in odometry’s translation estimate from rotation.
    alpha5: 0.20       # For Omni models only: translation noise.
    base_frame_id: "base_link"
    beam_skip_distance: 0.5 # Ignore beams that most particles disagree with in Likelihood field model. Maximum distance to consider skipping for (m).
    beam_skip_error_threshold: 0.4  # Percentage of beams after not matching map to force full update due to bad convergance.
    beam_skip_threshold: 0.3  # Percentage of beams required to skip.
    do_beamskip: true  # Whether to do beam skipping in Likelihood field model.
    global_frame_id: "map"  # The name of the coordinate frame published by the localization system.
    lambda_short: 0.1   # Exponential decay parameter for z_short part of model.
    laser_likelihood_max_dist: 2.0 # Maximum distance to do obstacle inflation on map, for use in likelihood_field model.
    laser_max_range: 10.0   # Maximum scan range to be considered, -1.0 will cause the laser’s reported maximum range to be used.
    laser_min_range: -1.0   # Minimum scan range to be considered, -1.0 will cause the laser’s reported minimum range to be used.
    laser_model_type: "likelihood_field" # Which model to use, either beam, likelihood_field, or likelihood_field_prob.
    max_beams: 60 ### 360          # How many evenly-spaced beams in each scan to be used when updating the filter.
    max_particles: 1000 ### 5000     # Maximum allowed number of particles.
    min_particles: 500 ### 2000     # Minimum allowed number of particles.
    odom_frame_id: "odom"   # Which frame to use for odometry.
    pf_err: 0.03            # Particle Filter population error.  
    pf_z: 0.99              # Particle filter population density.
    recovery_alpha_fast: 0.01   # Exponential decay rate for the fast average weight filter, used in deciding when to recover by adding random poses.
    recovery_alpha_slow: 0.0001  # Exponential decay rate for the slow average weight filter, used in deciding when to recover by adding random poses. A good value might be 0.001.
    resample_interval: 2 ### 1    # Number of filter updates required before resampling.
    robot_model_type: "nav2_amcl::DifferentialMotionModel" # The fully-qualified type of the plugin class.
    save_pose_rate: 4.0 ### 0.5     # Maximum rate (Hz) at which to store the last estimated pose and covariance to the parameter server.
    sigma_hit: 0.2          # Standard deviation for Gaussian model used in z_hit part of the model.
    tf_broadcast: true      # Set this to false to prevent amcl from publishing the transform between the global frame and the odometry frame.
    transform_tolerance: 0.2 # Time with which to post-date the transform that is published, to indicate that this transform is valid into the future.
    # One degree = 0.017453278 radians
    update_min_a: 0.05        # Rotational movement required before performing a filter update.
                             # 0.005 was too low (~0.3°): AMCL over-corrected map→odom during turns.
    update_min_d: 0.01     # Translational movement required before performing a filter update.
    z_hit: 0.9 ###0.95             # Mixture weight for z_hit part of model, sum of all used z weight must be 1. 
    z_max: 0.05 ###0.001            # Mixture weight for z_max part of model, sum of all used z weight must be 1. Beam uses all 4, likelihood model uses z_hit and z_rand.
    z_rand: 0.1 ###0.05            # Mixture weight for z_rand part of model, sum of all used z weight must be 1.
    z_short: 0.05 ###0.001          # Mixture weight for z_short part of model, sum of all used z weight must be 1.
    scan_topic: scan  # Use filtered scan topic (either top or cup lidar depending on do_top_lidar parameter)
    set_initial_pose: true # Causes AMCL to set initial pose from the initial_pose* parameters instead of waiting for the initial_pose message.
    initial_pose:
      x: 8.3 # 9.531 #8.81
      y: 2.4633 # 2.075 #2.64
      yaw: 3.132

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10     # 10ms = 100 Hz BT tick rate for responsive decisions
    default_server_timeout: 5 # 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    default_nav_to_pose_bt_xml: '/home/ros/sigyn_ws/install/sigyn_bringup/share/sigyn_bringup/bt_xml/navigate_to_pose_w_recovery.xml'
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.

    # plugin_lib_names is used to add custom BT plugins to the executor (vector of strings).
    # Built-in plugins are added automatically
    # plugin_lib_names: []
    # sigyn_behavior_trees plugins disabled - package not built in this workspace
    plugin_lib_names:
    - sigyn_say_something_plugin_node
    # - sigyn_move_a_short_distance_ahead_plugin_node

    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5    # increased tolerance to reduce recovery triggers
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["precise_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: true  # Re-enabled: false was only needed for Mac/VM simulation, not on real robot hardware
    # current_progress_checker: "progress_checker"  # explicit progress checker selection
    # current_goal_checker: "precise_goal_checker"    # explicit goal checker selection
    
    # Progress checker parameters (adjusted for MPPI controller behavior)
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.15    # reduced radius requirement
      movement_time_allowance: 10.0    # 10s: VL53 false-positive emergency stops can stall the robot for several seconds; 6s was too tight and caused spurious progress-checker failures
    # Goal checker parameters
    precise_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.10          # 10cm: achievable for a slow-moving differential drive robot
      yaw_goal_tolerance: 0.035       # ~2 degrees: must face dock precisely for AprilTag detection at staging
      stateful: True
    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      angular_dist_threshold: 0.785  # ~45 degrees: spin in place when heading error exceeds this
      forward_sampling_distance: 0.5
      rotate_to_heading_angular_vel: 0.5  # reduced from 0.8: was ~2x the robot's validated safe/stable angular speed (~0.43 rad/s), causing wild rotation while achieving staging pose
      max_angular_accel: 0.8  # reduced from 1.5 to match the gentler angular velocity above
      simulate_ahead_time: 1.0
      primary_controller: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      ax_max: 1.0
      ax_min: -1.0
      ay_max: 2.0
      az_max: 2.0
      vx_std: 0.3
      vy_std: 0.3
      wz_std: 0.5
      vx_max: 0.5
      vx_min: -0.10            # allow slow reverse motion so MPPI can back out of tight doorway approaches
      vy_max: 0.5
      wz_max: 0.6  # reduced from 1.5: was ~3.5x the robot's validated safe/stable angular speed (~0.43 rad/s)
      iteration_count: 1
      prune_distance: 1.5
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: false
      regenerate_noises: true
      critics: [
        "ConstraintCritic", "CostCritic", "GoalCritic",
        "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
        "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        near_collision_cost: 253
        critical_cost: 300.0
        consider_footprint: false  # true causes SIGSEGV when costmap uses robot_radius instead of footprint polygon
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0
      # TwirlingCritic:
      #   enabled: true
      #   twirling_cost_power: 1
      #   twirling_cost_weight: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      debug: True
      # always_send_full_costmap: True # Whether to send full costmap every update, rather than updates.
      global_frame: odom
      height: 4 # Height of costmap (m) - increased for better lookahead
      # initial_transform_timeout: 60.0 # Time to wait for transform to be available before erroring out.
      # lethal_cost_threshold: 100 # Minimum cost of an occupancy grid map to be considered a lethal obstacle.
      # map_topic: /map # Topic of map from map_server or SLAM.
      # origin_x: 0.0 # X origin of the costmap relative to width (m).
      # origin_y: 0.0 # Y origin of the costmap relative to height (m).
      publish_frequency: 5.0 # Frequency to publish costmap to topic.
      resolution: 0.0508 # Resolution of 1 pixel of the costmap, in meters.
      robot_base_frame: base_link
      robot_radius: 0.28 # Radius of robot base (m). # was 0.2286, enlarge footprint buffer
      rolling_window: True # Whether costmap should roll with robot base frame.
      # track_unknown_space: True # If false, treats unknown space as free space, else as unknown space.
      transform_tolerance: 0.2 # TF transform tolerance.
      # trinary_costmap: True # Whether to use trinary or continuous costmap.
      # unknown_cost_value: 255 # Cost of unknown space if tracking it.
      update_frequency: 15.0 # Costmap update frequency.
      width: 4 # Width of costmap (m) - increased for better lookahead

      plugins: [
        "voxel_layer",        # Low lidar clears/marks first
        "oakd_top_layer",     # OAK-D (currently disabled)
        "range_sensor_layer", # VL53L0X proximity sensors (currently disabled below, see enabled: False)
        "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True

      voxel_layer:
        enabled: True
        plugin: "nav2_costmap_2d::VoxelLayer"
        footprint_clearing_enabled: True
        combination_method: 1  # Max
        publish_voxel_map: False
        origin_z: 0.0
        z_resolution: 0.2  # 20cm voxel height resolution
        z_voxels: 10       # 10 voxels = 2m total height
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan_low
        # Low lidar at 30cm height - detects obstacles at robot navigation height
        # Upper lidar NOT used for navigation - it sees doorframes as obstacles!
        scan_low:
          topic: /scan_cup
          data_type: "LaserScan"
          clearing: True
          marking: True
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0   # Mark all obstacles up to ceiling height
          obstacle_max_range: 2.5
          obstacle_min_range: 0.10  # 10cm minimum — driver already turns <0.2m returns to NaN, this is defence-in-depth against any residual glass/spurious near returns
          raytrace_max_range: 3.0
          raytrace_min_range: 0.10  # match obstacle_min_range

      inflation_layer:
        enabled: True
        cost_scaling_factor: 3.5   # reduced so inflation cost doesn't drop off too sharply
        inflation_radius: 0.35   # must exceed robot_radius (0.28m); was incorrectly reduced to 0.15m
        plugin: "nav2_costmap_2d::InflationLayer"

      oakd_top_layer:
        enabled: False  # Temporarily disable to diagnose full-red costmap
        combination_method: 1 # 0 => Overwrite, 1 => >Max, 2 => MaxWithoutUnknownOverwrite
        footprint_clearing_enabled: True # Clear any occupied cells under robot footprint.
        map_subscribe_transient_local: True
        observation_sources: oakd_top
        plugin: "nav2_costmap_2d::ObstacleLayer"
        oakd_top:
          clearing: True # Whether source should raytrace clear in costmap.
          # expected_update_rate: 0.0 # Expected rate to get new data from sensor.
          data_type: "PointCloud2" # Correct data type for /stereo/points2
          inf_is_valid: True # Are infinite returns from laser scanners valid measurements to raycast.
          marking: True # Whether source should mark in costmap.
          max_obstacle_height: 2.0 # Maximum height to add return to occupancy grid.
          min_obstacle_height: 0.05 # Minimum height to add return to occupancy grid.
          obstacle_max_range: 2.4 # Maximum range to mark obstacles in costmap.
          obstacle_min_range: 0.0 # Minimum range to mark obstacles in costmap.
          raytrace_max_range: 3.0 # Maximum range to raytrace clear obstacles from costmap.
          raytrace_min_range: 0.0 # Minimum range to raytrace clear obstacles from costmap.
          topic: /stereo/points2 # Topic of data.

      range_sensor_layer:
        # TEMPORARILY DISABLED for docking diagnosis (2026-08-05): suspected VL53L0X
        # false-positive/short-range marking was implicated in MPPI "Optimizer fail
        # to compute path" bursts / Failed-to-make-progress cascades while
        # navigating to the docking staging pose. Re-enable once ruled in/out.
        enabled: False
        plugin: "nav2_costmap_2d::RangeSensorLayer"
        combination_method: 1   # Max combine so marked cells persist
        topics: [
          "/sigyn/sensors/range/rear_right_bkwd",
          "/sigyn/sensors/range/rear_right_side",
          "/sigyn/sensors/range/front_right_side",
          "/sigyn/sensors/range/front_right_fwd",
          "/sigyn/sensors/range/front_left_fwd",
          "/sigyn/sensors/range/front_left_side",
          "/sigyn/sensors/range/rear_left_side",
          "/sigyn/sensors/range/rear_left_bkwd"
        ]
        phi: 0.218            # VL53L0X half-angle: 25° total FOV = 12.5° = 0.218 rad.
                              # nav2 RangeSensorLayer phi is a HALF-angle: cells within
                              # ±phi of the sensor's pointing direction are marked/cleared.
        inflate_cone: 0.0     # No artificial cone inflation
        no_readings_timeout: 2.0   # Keep marks 2 s if sensor goes silent
        # mark_threshold: fraction of max_range below which cells are marked.
        # With max_range=0.5 m, 0.90 * 0.5 = 0.45 m — marks obstacles within ~45 cm.
        mark_threshold: 0.90
        # clear_threshold: fraction of max_range above which cells are cleared.
        # A reading at 0.5 m (max_range == out-of-range cap) clears the cell.
        clear_threshold: 0.98
        clear_on_max_reading: true  # Out-of-range readings (2 m capped) clear marks
        min_range: 0.10  # 10 cm: VL53L0X readings at exactly 0.000 m are hardware noise (minimum reliable range is ~30 mm); filtering sub-10 cm readings prevents spurious local-costmap inflation that blocks short-range goals
        max_range: 0.50


global_costmap:
  global_costmap:
    ros__parameters:
      always_send_full_costmap: True # Whether to send full costmap every update, rather than updates.
      global_frame: map
      publish_frequency: 1.0 # Frequency to publish costmap to topic.
      resolution: 0.0508 # Resolution of 1 pixel of the costmap, in meters.
      robot_base_frame: base_link
      robot_radius: 0.24      # Slightly smaller than physical radius (0.28m) so NavFn can plan
                              # through tight doorways. Local costmap keeps 0.28m for actual
                              # real-time collision avoidance.
      track_unknown_space: True # If false, treats unknown space as free space, else as unknown space.
      transform_tolerance: 0.5
      update_frequency: 5.0 # Costmap update frequency.

      plugins: [
        "static_layer", 
        "obstacle_layer", 
        "inflation_layer"
      ]

      inflation_layer:
        enabled: True
        cost_scaling_factor: 8.0   # match local inflation
        inflation_radius: 0.35     # larger global inflation radius
        plugin: "nav2_costmap_2d::InflationLayer"

      obstacle_layer:
        enabled: True
        footprint_clearing_enabled: True
        combination_method: 1 # 0 => Overwrite, 1 => >Max, 2 => MaxWithoutUnknownOverwrite
        observation_sources: scan # oakd_left_obstacle oakd_right_obstacle
        plugin: "nav2_costmap_2d::ObstacleLayer"
        scan:
          clearing: True # Whether source should raytrace clear in costmap.
          # expected_update_rate: 0.0 # Expected rate to get new data from sensor.
          data_type: "LaserScan" # Data type of input, LaserScan or PointCloud2.
          inf_is_valid: True # Are infinite returns from laser scanners valid measurements to raycast.
          marking: True # Whether source should mark in costmap.
          max_obstacle_height: 2.0 # Maximum height to add return to occupancy grid.
          ###min_obstacle_height: 0.0 # Minimum height to add return to occupancy grid.
          obstacle_max_range: 2.5 ###8.0 # Maximum range to mark obstacles in costmap.
          obstacle_min_range: 0.0 # Minimum range to mark obstacles in costmap.
          raytrace_max_range: 3.0 ###8.0 # Maximum range to raytrace clear obstacles from costmap.
          raytrace_min_range: 0.0 # Minimum range to raytrace clear obstacles from costmap.
          topic: /scan # Topic of data.

        oakd_left_obstacle: 
          topic: /oakd_left/stereo/points
          data_type: "PointCloud2"
          max_obstacle_height: 2.0
          min_obstacle_height: 0.01
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
          clearing: False
          marking: True
        oakd_right_obstacle:
          topic: /oakd_right/stereo/points
          data_type: "PointCloud2"
          max_obstacle_height: 2.0
          min_obstacle_height: 0.01
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
          clearing: False
          marking: True
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True

map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.10  # match xy_goal_tolerance in goal checker
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.6  # Match controller and smoother limits (reduced from 1.5 to match validated safe angular speed)
    min_rotational_vel: 0.4
    rotational_acc_lim: 1.5  # reduced from 3.2 to match the gentler angular velocity above

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_realtime_priority: true  # overridden to false in simulation via nav launch param substitution
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.5, 0.0, 0.6]  # Match controller angular velocity limit (reduced from 1.5 to match validated safe angular speed)
    min_velocity: [0.0, 0.0, -0.6]    # no reverse (matches vx_min=0 in MPPI controller)
    max_accel: [2.5, 0.0, 1.5]
    max_decel: [-2.5, 0.0, -1.5]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    # Polygons represent zone around the robot for "stop", "slowdown" and "limit" action types,
    # and robot footprint for "approach" action type.
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 2.0      # increased: more stopping distance before impact
      simulation_time_step: 0.1
      min_points: 2               # lowered: table leg produces only 2-3 lidar returns; 6 made it invisible
      visualize: False
      enabled: True
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "scan"
      min_height: 0.15
      max_height: 2.0
      enabled: True

docking_server:
  ros__parameters:
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.035  # ~2 degrees: opennav_docking uses this for BOTH position (m) and angular (rad) prestaging checks

    # Types of docks
    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.08  # 80mm - tighter than 100mm, looser than 50mm
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: true  # Monitor /sigyn/power/charger for charging confirmation
      use_stall_detection: true
      
      # AprilTag detection topic and frame
      external_detection_topic: "/oakd_apriltag_node/detections"
      dock_detection_frame: "oakd_apriltag_optical_frame"
      
      # Detection frame: oakd_apriltag_optical_frame
      # Measured AprilTag pose when docked (5-sample average, 2026-08-05, robot manually positioned):
      #   x=-0.0883m, y=+0.0082m, z=0.360m  (sub-mm consistency across samples)
      # Previous values (Tests 1-2, old dock pose [8.1833, 2.4301]):
      #   Test 1: x=-0.127m, y=-0.019m, z=0.344m
      #   Test 2: x=-0.126m, y=-0.010m, z=0.341m
      external_detection_timeout: 2.0
      external_detection_translation_x: -0.0883  # Measured when correctly docked (2026-08-05)
      external_detection_translation_y:  0.0082  # Measured y-offset; near zero = laterally centred
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.5  # test5 2026-08-11: increased from 0.3 — AprilTag updates ~1.5 Hz during
                        # approach; filter_coef=0.3 (30% new / 70% old) caused ~0.5s detection
                        # lag → ~2.5cm positional lag at v_linear_min=0.05 m/s, which is the
                        # observed residual lateral error at mating. 0.5 (50/50) cuts lag ~half.
                        # (Original 0.1 was over-smoothing; 0.3 was still too laggy for lateral)
      
      # Charging validation (from /sigyn/power/charger topic)
      charging_threshold: 0.01  # Current in Amps - positive indicates charging
      battery_state_topic: "/sigyn/power/charger"

    # Dock instances are loaded from docking_stations.yaml
    # This allows easy management of multiple docking locations

    controller:
      k_phi: 4.0  # test4 2026-08-11: reduced from 6.0 — at 6.0 the aggressive lateral
                  # correction caused the robot to drift 20° anticlockwise during approach
                  # (y-offset at staging entry caused overcorrection that k_delta couldn't
                  # recover). 4.0 still provides meaningful lateral correction.
      k_delta: 4.0  # test4 2026-08-11: increased from 2.0 — heading recovery was too weak
                  # relative to k_phi, causing yaw to drift and never recover toward -180°
                  # during the approach. Higher k_delta pulls heading back faster.
      slowdown_radius: 1.0  # explicitly set (was package default/unset): starts the
                  # v_linear_max->v_linear_min deceleration ramp across nearly the whole
                  # approach distance, giving more control-loop iterations for k_phi's
                  # lateral correction to actually take effect before contact.
      v_linear_min: 0.05
      v_linear_max: 0.08
      use_collision_detection: false
      costmap_topic: "/local_costmap/costmap_raw"
      footprint_topic: "/local_costmap/published_footprint"
      transform_tolerance: 0.1
      projection_time: 5.0
      simulation_step: 0.1
      dock_collision_threshold: 0.5

loopback_simulator:
  ros__parameters:
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    map_frame_id: "map"
    scan_frame_id: "base_scan"  # tb4_loopback_simulator.launch.py remaps to 'rplidar_link'
    update_duration: 0.02